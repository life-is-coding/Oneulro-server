apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneulro-server
  labels:
    app: oneulro-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oneulro-server
  template:
    metadata:
      labels:
        app: oneulro-server
    spec:
      nodeSelector:
        node-role: master  # Master Node에 배포
      containers:
      - name: oneulro-server
        image: ${DOCKER_REGISTRY}:${IMAGE_TAG}
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: server-config
        env:
        # Secrets (민감한 정보만)
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        - name: TOUR_API_KEY
          valueFrom:
            secretKeyRef:
              name: tour-api-secret
              key: service-key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        - name: KAKAO_REST_API_KEY
          valueFrom:
            secretKeyRef:
              name: kakao-secret
              key: rest-api-key
        - name: KAKAO_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: kakao-secret
              key: client-secret
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: oneulro-server
spec:
  selector:
    app: oneulro-server
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30800
  type: NodePort
